[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afriweave"
version = "0.1.0"
description = "Interactive NLP prototype for culturally focused text generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "keras",
    "numpy",
    "pandas",
    "plotly",
    "scikit-learn",
    "scipy",
    "streamlit",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
